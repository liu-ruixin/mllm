# MMMU multimodal benchmark.

inherits: base.yaml

run:
  name: qwen3_5_vl_mmmu
  description: MMMU multimodal benchmark.
  mode: accuracy

model:
  name: Qwen3.5-VL
  served_model_name: Qwen3.5-VL

generation:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 4096
  presence_penalty: 1.5
  repetition_penalty: 1.0
  stop: null

request:
  chat_template_kwargs:
    enable_thinking: false

warmup:
  enabled: true
  requests: 1
  max_tokens: 8

dataset:
  manifest: benchmark_multimodal/data/mmmu.jsonl
  split: validation
  limit: null
  task_filter:
    - mmmu

input:
  image_url_mode: path
  allow_local_paths: true

scoring:
  enabled: true
  default_scorer: normalized_match
  scorers:
    option: option_match
    short_text: normalized_match
  option:
    require_final_or_single: true

output:
  root_dir: benchmark_multimodal/results/mmmu
  predictions_jsonl: predictions.jsonl
  summary_json: summary.json
  summary_csv: summary.csv
  report_md: report.md
